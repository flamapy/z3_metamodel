name: Python analysis

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installing dependencies
        run: |
              python -m pip install --upgrade pip
              pip install setuptools
              pip install "git+https://github.com/flamapy/flamapy_fw@develop"
              pip install "git+https://github.com/flamapy/fm_metamodel@develop"
              pip install .
      - name: Installing Ruff linter
        run: |
            pip install ruff
      - name: Running Ruff linter
        run: |
            ruff check .
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install "git+https://github.com/flamapy/flamapy_fw@develop"
          pip install "git+https://github.com/flamapy/fm_metamodel@develop"
          pip install .
      - name: Running static types with mypy
        run: |
          mypy -p flamapy
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          # The sibling packages the dev pins and the test extra need are not on PyPI
          # until the dev release: take them from their develop branches first.
          pip install "git+https://github.com/flamapy/flamapy_fw@develop"
          pip install "git+https://github.com/flamapy/fm_metamodel@develop"
          pip install ".[test]"
      - name: Running test
        run: |
          python -m pytest
